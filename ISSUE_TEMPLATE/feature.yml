name: Feature Request
description: Propose a new feature, architecture capability, or engine improvement.
labels: ["type: feature", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please check open issues and pull requests to ensure your proposal is not already tracked.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or architectural limitation does this proposal solve?
      placeholder: |
        Currently, network port mapping must be manually assigned in vne-config.yml.
        Adding automatic LLDP/CDP discovery would allow seamless switch port tagging.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Solution
      description: Describe the proposed interface, configuration schema, and behavioral changes.
      placeholder: |
        Extend `vne discover` with LLDP listener daemon to detect neighbor port IDs
        and auto-populate `manifest.json`.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - Vector Metal Engine (VME)
        - Vector Network Engine (VNE)
        - Vector Services Engine (VSE)
        - Vector Lifecycle Engine (VLE)
        - Vector Gateway (Rust Daemon)
        - Velocitee Prism (AI Privacy Hub)
        - Web Console & Dashboards
        - Documentation & Guides
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds did you consider, and why are they less optimal?

  - type: textarea
    id: context
    attributes:
      label: Operational Context & Target Architecture
      description: Hardware architectures (x86_64, aarch64, riscv64), network topologies, or carrier scenarios where this applies.
