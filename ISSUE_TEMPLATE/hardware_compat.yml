name: Hardware Compatibility Report
description: Report hardware compatibility test results (success, failure, or caveats) for Velocitee.
labels: ["type: hardware-compat", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Hardware compatibility reports help operators across community and enterprise deployments know what hardware works reliably.

  - type: dropdown
    id: result
    attributes:
      label: Compatibility Status
      options:
        - Fully Functional (Zero issues, standard automated install)
        - Functional with Caveats (Requires specific BIOS/boot settings)
        - Partially Functional (Some features or interfaces unsupported)
        - Non-Functional (Boot or installation failure)
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware Specifications
      description: Manufacturer, appliance model, CPU architecture, NICs, and firmware/BIOS version.
      placeholder: |
        - System / Motherboard: Supermicro SuperServer SYS-E300-9D
        - CPU / Architecture: Intel Xeon D-2123IT (x86_64) / 4 cores
        - NICs: 2x 10GbE SFP+ (ixgbe), 2x 1GbE RJ45 (igb)
        - Storage: Samsung PM983 NVMe M.2
        - BIOS / UEFI Version: 1.4b (CSM disabled, UEFI boot)
    validations:
      required: true

  - type: textarea
    id: software
    attributes:
      label: Software Stack & Versions
      placeholder: |
        - Velocitee Engine Version: 0.1.0 (commit SHA)
        - Hypervisor / OS: Proxmox VE 8.2 / Ubuntu 24.04 LTS
        - Target Kernel: Linux 6.8.4-pve
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Operational Notes & Required Workarounds
      description: Any specific BIOS tweaks, kernel parameters (`nomodeset`, `pcie_aspm=off`), or driver workarounds.
      placeholder: |
        Required disabling Secure Boot in UEFI. All NICs recognized out-of-the-box by cloud-init.

  - type: textarea
    id: config
    attributes:
      label: Relevant Configuration Snippet
      description: Sanitized `velocitee.yml` or `vme-config.yml` used during the test.
