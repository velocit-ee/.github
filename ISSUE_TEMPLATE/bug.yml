name: Bug Report
description: Report an unexpected error, failure, or bug in Velocitee.
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide detailed context to help maintainers reproduce and resolve the issue quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: Summary & Expected Behavior
      description: What happened versus what you expected to happen?
      placeholder: |
        Expected: Node boots iPXE and completes cloud-init without timeout.
        Actual: DHCP timeout during second-stage chainload on Port 4.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Exact commands, configurations, or operations that trigger the issue.
      placeholder: |
        1. Configure velocitee.yml with static IP configuration.
        2. Run `vme deploy` against bare-metal node.
        3. Observe timeout during initrd extraction.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Hardware architecture, operating system, and software versions.
      placeholder: |
        - Hardware / Appliance: Protectli FW4B / GL-AXT1800
        - Hypervisor: Proxmox VE 8.2 / Bare Metal
        - Target OS: Ubuntu 24.04 LTS
        - Engine Version / Commit: 0.1.0 / git commit SHA
        - Python / Rust Version: Python 3.12 / Rust 1.80
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs & Diagnostic Traces
      description: Paste relevant execution logs, stack traces, or journalctl output.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Network topology, VLAN mappings, switch hardware, or other notes.
